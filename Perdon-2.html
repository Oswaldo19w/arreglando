<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo siento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Georgia', serif;
        }

        /* Contenedor de pétalos */
        #petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            background-color: #ff4d4d;
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Corazón latiente */
        .heart-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: beat 1.2s infinite;
        }

        .heart {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #b30000; /* Rojo oscuro */
            transform: rotate(-45deg);
            /* Sombra para dar profundidad */
            box-shadow: -10px 10px 50px rgba(255, 0, 0, 0.3);
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #b30000;
            border-radius: 50%;
        }

        .heart::before { top: -100px; left: 0; }
        .heart::after { left: 100px; top: 0; }

        @keyframes beat {
            0% { transform: scale(1); }
            15% { transform: scale(1.1); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Texto dentro del corazón */
        .text-overlay {
            position: absolute;
            z-index: 10;
            color: white;
            text-align: center;
            width: 180px;
            font-size: 1.1rem;
            line-height: 1.4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #typed-text {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="petals-container"></div>

    <div class="heart-container">
        <div class="heart"></div>
        <div class="text-overlay">
            <span id="typed-text"></span>
        </div>
    </div>

    <script>
        // Configuración del texto
        const message = "Perdóname... Me arrepiento de todo corazón por haber descuidado lo que con tanto amor estábamos formando. Eres lo más importante para mí.";
        const speed = 100; // Velocidad en milisegundos
        let i = 0;

        function typeWriter() {
            if (i < message.length) {
                document.getElementById("typed-text").innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        // Crear pétalos cayendo
        function createPetal() {
            const container = document.getElementById('petals-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Tamaño y posición aleatoria
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            
            // Duración de caída aleatoria
            const duration = Math.random() * 3 + 4 + 's';
            petal.style.animationDuration = duration;

            container.appendChild(petal);

            // Eliminar pétalo después de que caiga
            setTimeout(() => {
                petal.remove();
            }, 7000);
        }

        // Iniciar efectos
        setInterval(createPetal, 300);
        window.onload = typeWriter;
    </script>
</body>
</html>
